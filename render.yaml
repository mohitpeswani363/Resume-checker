services:
  - type: web
    name: resume-checker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: resume-checker
          property: host
      - key: DB_PATH
        value: /app/data/resume_checker.db
    disk:
      name: resume-data
      mountPath: /app/data
      sizeGB: 1
